# Syncs the JSON Schemas to the organization pages site so the $id URLs
# declared inside the schemas resolve to real content. The deployed
# schemas always mirror the latest released @makinuki/spec package,
# never an unreleased master state. Requires a repository secret named
# MAKINUKI_BOT_TOKEN with contents write access to
# makinuki/makinuki.github.io.

name: Schema site

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-site
  cancel-in-progress: false

jobs:
  sync-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read release version
        id: version
        run: |
          doc=$(sed -n 's/^\*\*Version:\*\*[ `]*\([0-9][0-9.]*\).*/\1/p' SPECIFICATION.md | head -n 1)
          echo "version=$doc" >> "$GITHUB_OUTPUT"

      - name: Deploy schemas to org pages
        env:
          TOKEN: ${{ secrets.MAKINUKI_BOT_TOKEN }}
        run: |
          git config --global user.name "Byururu-sama"
          git config --global user.email "97214346+Byururu-sama@users.noreply.github.com"
          git clone https://github.com/makinuki/makinuki.github.io.git site
          cd site
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/makinuki/makinuki.github.io.git"
          rm -rf schemas
          mkdir schemas
          cp ../schemas/*.schema.json schemas/
          git add -A
          if git diff --cached --quiet; then
            echo "schemas unchanged, nothing to push"
          else
            git commit -m "chore(schemas): sync from spec v${{ steps.version.outputs.version }}"
            git push origin main
          fi

      # The pages deployment can lag the push by minutes on a cold
      # build; re-check every schema each round against a global
      # deadline and fail the run on timeout or content drift.
      - name: Verify live schemas
        run: |
          deadline=$((SECONDS + 300))
          while [ $SECONDS -lt $deadline ]; do
            pending=0
            for f in schemas/*.schema.json; do
              name=$(basename "$f")
              url="https://makinuki.github.io/schemas/$name"
              if curl -fsSL "$url" -o live.json && diff -q "$f" live.json > /dev/null; then
                echo "live ok: $url"
              else
                pending=1
              fi
            done
            [ $pending -eq 0 ] && exit 0
            sleep 15
          done
          echo "live verification timed out" >&2
          exit 1
